services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try {
            if (db.hello().isWritablePrimary) { quit(0); }
          } catch (e) {
            try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); } catch (e2) {}
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__ConnectionString: mongodb://mongo:27017/?replicaSet=rs0
      Mongo__Database: shop
    ports:
      - "8080:8080"

volumes:
  mongo-data:
